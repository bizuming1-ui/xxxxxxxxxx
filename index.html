<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello GitHub</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #f6f8fa;
      color: #24292f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      color: #fff;
      background: #2da44e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #2c974b;
    }

    button:active {
      transform: scale(0.97);
    }

    #time {
      min-height: 1.5em;
      font-size: 1.25rem;
      color: #57606a;
    }
  </style>
</head>
<body>
  <h1>Hello GitHub</h1>
  <button id="btn">显示当前时间</button>
  <p id="time"></p>

  <script>
    const btn = document.getElementById('btn');
    const timeEl = document.getElementById('time');

    btn.addEventListener('click', function () {
      const now = new Date();
      timeEl.textContent = '当前时间:' + now.toLocaleString('zh-CN', { hour12: false });
    });
  </script>
</body>
</html>
